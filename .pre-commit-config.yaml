repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.3
    hooks:
      - id: clang-format
        name: clang-format auto-fix for project sources
        args: ["--style=file"]
        files: ^(src/|cpp_tests/|inc/).*\.(cpp|hpp)$
        pass_filenames: false
        entry: bash -c 'find ./src ./cpp_tests ./inc -regex ".*\\.\(cpp\|hpp\)$" -exec clang-format -i {} \;'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
